schema_version = "1.3"
artifacts = ["/task/extractions.json"]

[task]
name = "synthesis-bench/full-text-extraction"
description = "Full-text extraction task: extract arm-level outcome data from primary papers. Human references and grader live verifier-side only."
keywords = ["systematic-review", "cochrane", "full-text-extraction", "extraction", "harbor"]
[[task.authors]]
name = "knrz"
email = "knouroozi@gmail.com"

[metadata]
difficulty = "medium"
category = "machine-learning"
multi_step_reward_strategy = "mean"

[agent]
timeout_sec = 1800.0
network_mode = "public"

[verifier]
timeout_sec = 900.0
network_mode = "public"
environment_mode = "separate"

[verifier.environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"

[[steps]]
name = "extract"
[steps.agent]
timeout_sec = 1800.0
[steps.verifier]
timeout_sec = 900.0
