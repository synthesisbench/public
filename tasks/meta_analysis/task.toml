schema_version = "1.3"
artifacts = ["/task/analyses.json"]

[task]
name = "synthesis-bench/meta-analysis"
description = "Meta-analysis task: pool staged arm rows by following result-free synthesis method context. Human references and grader live verifier-side only."
keywords = ["systematic-review", "meta-analysis", "harbor"]
[[task.authors]]
name = "knrz"
email = "knouroozi@gmail.com"

[metadata]
difficulty = "medium"
category = "machine-learning"
multi_step_reward_strategy = "mean"

[agent]
timeout_sec = 1800.0
network_mode = "public"

[verifier]
timeout_sec = 300.0
network_mode = "public"
environment_mode = "separate"

[verifier.environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"

[[steps]]
name = "meta"
[steps.agent]
timeout_sec = 1800.0
[steps.verifier]
timeout_sec = 300.0
